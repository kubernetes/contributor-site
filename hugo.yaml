baseURL: 'https://www.kubernetes.dev/'
title: &title Kubernetes Contributors # Create a reference to use later
theme:
  - docsy
themesDir: node_modules
enableRobotsTXT: true

# Language settings
contentDir: content/en

enableMissingTranslationPlaceholders: true
disableKinds:
  - taxonomy

# Configure how URLs look like per section.
permalinks:
  blog: '/:section/:year/:month/:day/:slug/'

# Image processing configuration.
imaging:
  resampleFilter: CatmullRom

services:
  googleAnalytics:
    # Fake ID in support of [params.ui.feedback]. The real GA ID is set in the Netlify config.
    id: UA-00000000-0

# Hugo internal caching
caches:
  assets:
    dir: ':cacheDir/_gen'
    maxAge: -1
  getcsv:
    dir: ':cacheDir/:project'
    maxAge: 60s
  getjson:
    dir: ':cacheDir/:project'
    maxAge: 60s
  getresource:
    dir: ':cacheDir/:project'
    maxAge: 2h
  images:
    dir: ':cacheDir/_images'
    maxAge: -1
  modules:
    dir: ':cacheDir/modules'
    maxAge: -1

module:
  hugoVersion:
    extended: true
    min: "0.133.0"
  # NOTE: mount targets are relative to Hugo's CONTENT COMPONENT, whose root is
  # `contentDir: content/en` (set above). They must therefore be `content/<path>`
  # and NOT `content/en/<path>` -- the latter resolves to content/en/en/<path>
  # and publishes every mounted page under /en/, silently leaving the real URLs
  # empty while the build still exits 0.
  #
  # Module imports pin upstream content versions via go.sum. The pin governs
  # deploy previews and local dev; production refreshes to latest upstream at
  # build time (see the Makefile). Content is mounted directly from modules.
  #
  # Directory mounts publish upstream trees wholesale. Individual file mounts
  # exist almost entirely to PRESERVE the URLs the site already serves -- each
  # one has a matching entry in its directory mount's excludeFiles, because a
  # file mount does not suppress the same file arriving via its parent
  # directory mount.
  imports:
    - path: k8s.io/community
      mounts:
        # --- Directory mounts: upstream trees published wholesale ---
        - source: contributors/guide
          target: content/docs/guide
          excludeFiles:
            - "**/README.md"
            - "**/README-*.md"   # localised cheatsheets are not English pages
            - "**/OWNERS"
            - "coding-conventions.md"       # preserved as coding-convention.md
            - "contributor-cheatsheet/**"   # preserved at /docs/contributor-cheatsheet/
        - source: communication
          target: content/docs/comms
          excludeFiles:
            - "**/README.md"
            - "**/README-*.md"
            - "**/OWNERS"
            - "best-practices.md"           # preserved as notifications.md
            - "calendar-guidelines.md"      # preserved as calendars.md
            - "discuss-guidelines.md"       # preserved as discuss.md
            - "mailing-list-guidelines.md"  # preserved as mailing-lists.md
            - "requesting-survey.md"        # preserved as surveys.md
            - "slack-guidelines.md"         # preserved as slack.md
            - "zoom-guidelines.md"          # preserved as zoom.md
            - "youtube/**"                  # guidelines own /docs/comms/youtube/
        - source: mentoring
          target: content/community
          excludeFiles:
            - "**/README.md"
            - "**/README-*.md"
            - "**/OWNERS"
            - "new-contributor-orientation/**"  # preserved under /docs/orientation/
        - source: mentoring/new-contributor-orientation
          target: content/docs/orientation
          excludeFiles:
            - "**/README.md"
            - "**/OWNERS"
        - source: committee-code-of-conduct
          target: content/community/committee-code-of-conduct
          excludeFiles:
            - "**/README.md"
            - "**/README-*.md"
            - "**/OWNERS"
            - "incident-process.md"  # preserved at /community/code-of-conduct-incident-process/
        - source: github-management
          target: content/resources/github-management
          excludeFiles:
            - "**/README.md"
            - "**/README-*.md"
            - "**/OWNERS"
            - "default-branch-migration.md"  # preserved at /resources/rename/

        # --- Individual file mounts (sig-list, values, policies, etc.) ---
        - source: sig-list.md
          target: content/sig-list.md
        - source: values.md
          target: content/community/values.md
        - source: code-of-conduct.md
          target: content/includes/code-of-conduct.md
        # CLA.md provided locally via content/en/CLA.md
        - source: community-membership.md
          target: content/community/community-membership.md

        # --- URL preservation: upstream renamed these, the site did not ---
        - source: contributors/guide/coding-conventions.md
          target: content/docs/guide/coding-convention.md
        - source: contributors/guide/contributor-cheatsheet/README.md
          target: content/docs/contributor-cheatsheet.md
        - source: communication/best-practices.md
          target: content/docs/comms/notifications.md
        - source: communication/calendar-guidelines.md
          target: content/docs/comms/calendars.md
        - source: communication/discuss-guidelines.md
          target: content/docs/comms/discuss.md
        - source: communication/mailing-list-guidelines.md
          target: content/docs/comms/mailing-lists.md
        - source: communication/requesting-survey.md
          target: content/docs/comms/surveys.md
        - source: communication/slack-guidelines.md
          target: content/docs/comms/slack.md
        - source: communication/zoom-guidelines.md
          target: content/docs/comms/zoom.md
        - source: communication/youtube/youtube-guidelines.md
          target: content/docs/comms/youtube.md
        - source: mentoring/README.md
          target: content/community/mentoring.md
        - source: committee-code-of-conduct/incident-process.md
          target: content/community/code-of-conduct-incident-process.md
        - source: github-management/default-branch-migration.md
          target: content/resources/rename.md

        # --- README.md -> _index.md section landing pages ---
        - source: contributors/guide/README.md
          target: content/docs/guide/_index.md
        - source: communication/contributor-comms/README.md
          target: content/docs/comms/contributor-comms/_index.md
        - source: communication/contributor-comms/blogging-resources/README.md
          target: content/docs/comms/contributor-comms/blogging-resources/_index.md
        - source: communication/slack-config/README.md
          target: content/docs/comms/slack-config/_index.md
        - source: mentoring/new-contributor-orientation/README.md
          target: content/docs/orientation/_index.md
        - source: mentoring/processes/README.md
          target: content/community/processes/_index.md
        - source: mentoring/programs/README.md
          target: content/community/programs/_index.md
        - source: mentoring/programs/contributor-workshop/README.md
          target: content/community/programs/contributor-workshop/_index.md
        - source: mentoring/programs/contributor-workshop/guides/README.md
          target: content/community/programs/contributor-workshop/guides/_index.md
        - source: mentoring/programs/contributor-workshop/live-workshop/README.md
          target: content/community/programs/contributor-workshop/live-workshop/_index.md
        - source: committee-code-of-conduct/README.md
          target: content/community/committee-code-of-conduct/_index.md
        - source: github-management/README.md
          target: content/resources/github-management/_index.md

    - path: github.com/cncf/foundation
      mounts:
        - source: code-of-conduct.md
          target: content/includes/cncf-code-of-conduct.md

    - path: github.com/kubernetes/sig-release
      mounts:
        - source: releases/release-1.37/README.md
          target: content/resources/release/index.md

  # Use npm-installed copies of Docsy Hugo Module deps so Hugo skips `go get`
  # at build time. The `go get` walks go.mod transitive imports and fails
  # wherever the dependency is absent (e.g. Netlify).
  replacements: "github.com/twbs/bootstrap -> bootstrap, github.com/FortAwesome/Font-Awesome -> @fortawesome/fontawesome-free"

# Language configuration
languages:
  en:
    title: *title # Use the YAML reference instead of repeating
    languageName: English

markup:
  goldmark:
    renderer:
      unsafe: true
  # Default highlight is tango for Docsy but the website uses emacs (for now)
  highlight:
    style: emacs
    noClasses: false

frontmatter:
  date:
    - date
    - ':filename'
    - publishDate
    - lastmod

# Everything below this are Site Params
params:
  # URLs the site already serves and promises to keep serving. Verified on every
  # build by layouts/partials/verify-mounts.html -- a missing entry FAILS the
  # build. Hugo silently ignores a module mount whose upstream source has been
  # renamed or deleted, so without this check a page can vanish from the live
  # site while every build stays green.
  #
  # Only URLs that predate the Hugo Modules migration are listed. Pages that
  # arrive via whole-tree directory mounts are deliberately not asserted -- they
  # come and go with upstream.
  expectedPages:
    - /docs/guide/
    - /docs/guide/coding-convention/
    - /docs/guide/contributing/
    - /docs/guide/expectations/
    - /docs/guide/first-contribution/
    - /docs/guide/github-workflow/
    - /docs/guide/help-wanted/
    - /docs/guide/issue-triage/
    - /docs/guide/non-code-contributions/
    - /docs/guide/owners/
    - /docs/guide/platforms/
    - /docs/guide/pull-requests/
    - /docs/guide/release-notes/
    - /docs/contributor-cheatsheet/
    - /docs/comms/calendars/
    - /docs/comms/discuss/
    - /docs/comms/mailing-lists/
    - /docs/comms/moderation/
    - /docs/comms/moderators/
    - /docs/comms/notifications/
    - /docs/comms/slack/
    - /docs/comms/surveys/
    - /docs/comms/youtube/
    - /docs/comms/zoom/
    - /docs/orientation/
    - /docs/orientation/nco-host-handbook/
    - /docs/orientation/nco-lead-handbook/
    - /docs/orientation/new-contributor-resources/
    - /community/mentoring/
    - /community/values/
    - /community/code-of-conduct-incident-process/
    - /includes/code-of-conduct/
    - /includes/cncf-code-of-conduct/
    - /resources/rename/
    - /resources/release/

  # Maps a mounted content path back to the upstream repo it came from, so
  # layouts/_default/_markup/render-link.html can expand a relative .md link
  # that points outside mounted content into a working upstream URL instead of
  # emitting a dead relative link. Order matters: longest prefix wins, so more
  # specific entries come first.
  upstreamSources:
    - target: docs/orientation
      source: mentoring/new-contributor-orientation
      base: https://github.com/kubernetes/community/blob/master
    - target: docs/guide
      source: contributors/guide
      base: https://github.com/kubernetes/community/blob/master
    - target: docs/comms
      source: communication
      base: https://github.com/kubernetes/community/blob/master
    - target: community/committee-code-of-conduct
      source: committee-code-of-conduct
      base: https://github.com/kubernetes/community/blob/master
    - target: resources/github-management
      source: github-management
      base: https://github.com/kubernetes/community/blob/master
    - target: community
      source: mentoring
      base: https://github.com/kubernetes/community/blob/master

  # This is used instead of the built-in top level `copyright` to utilize
  # Docsy's partial which adds the copyright year automatically
  copyright: The Kubernetes Authors
  gcs_engine_id: 8ad0f1b8442fece81

  # User interface configuration
  ui:
    # Enable to show the sidebar menu in its compact state.
    sidebar_menu_compact: true
    # Set to true to disable the About link in the site footer
    footer_about_disable: false

    # Adds an H2 section titled "Feedback" to the bottom of each doc. The responses are sent to Google Analytics as events.
    # This feature depends on [services.googleAnalytics] and will be disabled if "services.googleAnalytics.id" is not set.
    # If you want this feature, but occasionally need to remove the "Feedback" section from a single page,
    # add "hide_feedback: true" to the page's front matter.
    feedback:
      enable: true
    # The responses that the user sees after clicking "yes" (the page was helpful) or "no" (the page was not helpful).
    # yes = 'Glad to hear it! Please <a href="https://github.com/USERNAME/REPOSITORY/issues/new">tell us how we can improve</a>.'
    # no = 'Sorry to hear that. Please <a href="https://github.com/USERNAME/REPOSITORY/issues/new">tell us how we can improve</a>.'

  links:
    # End user relevant links. These will show up on left side of footer and in the community page if you have one.
    user:
      - name: Kubernetes Dev Mailing List
        url: 'https://groups.google.com/a/kubernetes.io/group/dev'
        icon: fa fa-envelope
        desc: Discussion and help from your fellow users
      - name: X
        url: 'https://x.com/K8sContributors'
        icon: fa-brands fa-x-twitter
        desc: Follow us on X to get the latest news!
      - name: LinkedIn
        url: 'https://www.linkedin.com/company/kubernetes'
        icon: fab fa-linkedin
        desc: "Kubernetes on LinkedIn"
      - name: YouTube
        url: 'https://youtube.com/kubernetescommunity'
        icon: fab fa-youtube
        desc: Kubernetes Community on YouTube
      - name: Mastodon
        url: 'https://hachyderm.io/@K8sContributors'
        icon: fab fa-mastodon
        desc: Follow us on Mastodon
      - name: BlueSky
        url: 'https://bsky.app/profile/kubernetes.dev'
        icon: fab fa-bluesky
        desc: Follow us on BlueSky
    # Developer relevant links. These will show up on right side of footer and in the community page if you have one.
    developer:
      - name: GitHub
        url: 'https://github.com/kubernetes/contributor-site'
        icon: fab fa-github
        desc: Source code for the Kubernetes Contributor Site!
      - name: Slack
        url: 'https://slack.k8s.io'
        icon: fab fa-slack
        desc: Chat with other project developers
